name: PR Sandbox Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ['**']

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-sandbox-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  main-freshness:
    name: Confirm PR is up to date with main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch latest main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Require latest main before preview
        run: node scripts/check-branch-up-to-date.mjs

  sandbox-preview:
    name: Build and deploy sandbox preview
    runs-on: ubuntu-latest
    environment: preview
    needs: main-freshness
    env:
      CF_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'inlight' }}
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
      VITE_SUPABASE_ENV: sandbox
      VITE_SUPABASE_ALLOW_REMOTE_SANDBOX: 'true'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SANDBOX_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SANDBOX_SUPABASE_PUBLISHABLE_KEY }}
      SANDBOX_SUPABASE_DB_URL: ${{ secrets.SANDBOX_SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate preview secrets
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY SUPABASE_ACCESS_TOKEN RESEND_API_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for PR sandbox previews."
              missing=1
            fi
          done
          exit "$missing"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Set up Supabase CLI
        if: ${{ env.SANDBOX_SUPABASE_DB_URL != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply sandbox database migrations
        if: ${{ env.SANDBOX_SUPABASE_DB_URL != '' }}
        run: supabase db push --db-url "$SANDBOX_SUPABASE_DB_URL" --yes --skip-vault

      - name: Skip sandbox database migrations
        if: ${{ env.SANDBOX_SUPABASE_DB_URL == '' }}
        run: echo "::notice::SANDBOX_SUPABASE_DB_URL is not configured, so PR sandbox database migrations were skipped."

      - name: Build sandbox app
        run: npm run build:sandbox

      - name: Deploy Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name="${{ env.CF_PAGES_PROJECT_NAME }}" --branch="${{ env.PREVIEW_BRANCH }}"

      - name: Extract preview URL
        id: preview-url
        env:
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          url="$(printf '%s\n' "$COMMAND_OUTPUT" | grep -Eo 'https://[^ ]+\.pages\.dev' | tail -n 1 || true)"
          if [ -z "$url" ]; then
            url="https://${PREVIEW_BRANCH}.${CF_PAGES_PROJECT_NAME}.pages.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy sandbox invite functions
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          project_ref="$(node -e "const host = new URL(process.env.VITE_SUPABASE_URL).hostname; const ref = host.split('.')[0]; if (!ref || host === 'piofmmawwnermvaysonw.supabase.co') process.exit(1); process.stdout.write(ref);")"

          npx --yes supabase@latest secrets set RESEND_API_KEY="$RESEND_API_KEY" SITE_URL="$PREVIEW_URL" --project-ref "$project_ref"
          npx --yes supabase@latest functions deploy send-platform-invite --project-ref "$project_ref"
          npx --yes supabase@latest functions deploy send-project-credit-invite --project-ref "$project_ref"

      - name: Configure sandbox auth URLs
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          project_ref="$(node -e "const host = new URL(process.env.VITE_SUPABASE_URL).hostname; const ref = host.split('.')[0]; if (!ref || host === 'piofmmawwnermvaysonw.supabase.co') process.exit(1); process.stdout.write(ref);")"
          export project_ref

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const projectRef = process.env.project_ref;
          const previewUrl = process.env.PREVIEW_URL?.replace(/\/+$/, '');
          const token = process.env.SUPABASE_ACCESS_TOKEN;

          if (!projectRef || !previewUrl || !token) {
            throw new Error('Missing project_ref, PREVIEW_URL, or SUPABASE_ACCESS_TOKEN.');
          }

          const allowList = [
            `${previewUrl}/**`,
          ].join(',');

          const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/config/auth`, {
            method: 'PATCH',
            headers: {
              Authorization: `Bearer ${token}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              site_url: previewUrl,
              uri_allow_list: allowList,
              mailer_subjects_confirmation: 'Confirm your Inlight account',
              mailer_templates_confirmation_content: readFileSync('supabase/templates/confirmation.html', 'utf8'),
            }),
          });

          if (!response.ok) {
            const body = await response.text();
            throw new Error(`Failed to configure Supabase Auth (${response.status}): ${body}`);
          }
          NODE

      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        with:
          script: |
            const marker = '<!-- inlight-sandbox-preview -->';
            const body = `${marker}
            Sandbox preview is ready:

            ${process.env.PREVIEW_URL}

            This preview was built only after confirming the PR branch includes the latest \`main\`, and it uses the sandbox Supabase environment.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  production-data-preview:
    name: Build and deploy production-data preview
    runs-on: ubuntu-latest
    needs: main-freshness
    env:
      CF_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'inlight' }}
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}-production-data
      PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate preview secrets
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for PR production-data previews."
              missing=1
            fi
          done
          exit "$missing"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Set up Supabase CLI
        if: ${{ env.PRODUCTION_SUPABASE_DB_URL != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply production database migrations
        if: ${{ env.PRODUCTION_SUPABASE_DB_URL != '' }}
        run: supabase db push --db-url "$PRODUCTION_SUPABASE_DB_URL" --yes --skip-vault

      - name: Skip production database migrations
        if: ${{ env.PRODUCTION_SUPABASE_DB_URL == '' }}
        run: echo "::notice::PRODUCTION_SUPABASE_DB_URL is not configured, so production-data preview database migrations were skipped."

      - name: Build production-data app
        run: npm run build

      - name: Deploy Cloudflare Pages production-data preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name="${{ env.CF_PAGES_PROJECT_NAME }}" --branch="${{ env.PREVIEW_BRANCH }}"

      - name: Extract preview URL
        id: preview-url
        env:
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          url="$(printf '%s\n' "$COMMAND_OUTPUT" | grep -Eo 'https://[^ ]+\.pages\.dev' | tail -n 1 || true)"
          if [ -z "$url" ]; then
            url="https://${PREVIEW_BRANCH}.${CF_PAGES_PROJECT_NAME}.pages.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment production-data preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        with:
          script: |
            const marker = '<!-- inlight-production-data-preview -->';
            const body = `${marker}
            Production-data preview is ready:

            ${process.env.PREVIEW_URL}

            This preview runs the PR code against the real Inlight Supabase project. Use it carefully: actions taken here can affect real shared data.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
