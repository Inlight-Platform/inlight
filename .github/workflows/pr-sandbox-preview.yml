name: PR Sandbox Preview

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ['**']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-sandbox-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  main-freshness:
    name: Confirm PR is up to date with main
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch latest main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Require latest main before preview
        run: node scripts/check-branch-up-to-date.mjs

  sandbox-preview:
    name: Build and deploy sandbox preview
    runs-on: ubuntu-latest
    needs: main-freshness
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    env:
      CF_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'inlight' }}
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
      VITE_SUPABASE_ENV: sandbox
      VITE_SUPABASE_ALLOW_REMOTE_SANDBOX: 'true'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SANDBOX_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SANDBOX_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate preview secrets
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for PR sandbox previews."
              missing=1
            fi
          done
          exit "$missing"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build sandbox app
        run: npm run build:sandbox

      - name: Deploy Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name="${{ env.CF_PAGES_PROJECT_NAME }}" --branch="${{ env.PREVIEW_BRANCH }}"

      - name: Extract preview URL
        id: preview-url
        env:
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          url="$(printf '%s\n' "$COMMAND_OUTPUT" | grep -Eo 'https://[^ ]+\.pages\.dev' | tail -n 1 || true)"
          if [ -z "$url" ]; then
            url="https://${PREVIEW_BRANCH}.${CF_PAGES_PROJECT_NAME}.pages.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        with:
          script: |
            const marker = '<!-- inlight-sandbox-preview -->';
            const body = `${marker}
            Sandbox preview is ready:

            ${process.env.PREVIEW_URL}

            This preview was built only after confirming the PR branch includes the latest \`main\`, and it uses the sandbox Supabase environment.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
